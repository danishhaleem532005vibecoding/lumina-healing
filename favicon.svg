<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4667"/>
      <stop offset="100%" stop-color="#0f293d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED59B"/>
      <stop offset="50%" stop-color="#C9AD70"/>
      <stop offset="100%" stop-color="#A68745"/>
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3C2B6"/>
      <stop offset="100%" stop-color="#729587"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- Crescent Moon and Stars -->
  <path d="M 52,22 A 38,38 0 1 0 88,74 A 32,32 0 1 1 52,22 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.85"/>
  <circle cx="60" cy="38" r="2.5" fill="url(#goldGrad)"/>
  <circle cx="70" cy="30" r="1.5" fill="#EED59B"/>
  <circle cx="48" cy="32" r="1.5" fill="#EED59B"/>

  <!-- Lotus Center Petal -->
  <path d="M 60,38 C 53,52 50,68 60,78 C 70,68 67,52 60,38 Z" fill="url(#sageGrad)" stroke="url(#goldGrad)" stroke-width="1.2"/>
  
  <!-- Inner Side Petals -->
  <path d="M 60,54 C 47,56 42,70 54,80 C 58,74 58,64 60,54 Z" fill="url(#sageGrad)" opacity="0.9" stroke="url(#goldGrad)" stroke-width="1"/>
  <path d="M 60,54 C 73,56 78,70 66,80 C 62,74 62,64 60,54 Z" fill="url(#sageGrad)" opacity="0.9" stroke="url(#goldGrad)" stroke-width="1"/>
  
  <!-- Outer Side Petals -->
  <path d="M 56,66 C 36,68 34,80 50,84 C 54,80 54,74 56,66 Z" fill="url(#sageGrad)" opacity="0.8" stroke="url(#goldGrad)" stroke-width="1"/>
  <path d="M 64,66 C 84,68 86,80 70,84 C 66,80 66,74 64,66 Z" fill="url(#sageGrad)" opacity="0.8" stroke="url(#goldGrad)" stroke-width="1"/>
  
  <!-- Base Lotus Pedestal Curve -->
  <path d="M 44,84 Q 60,89 76,84" fill="none" stroke="url(#goldGrad)" stroke-width="1.6" stroke-linecap="round"/>
</svg>
